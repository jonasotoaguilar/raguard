name: raguard

# Local development stack. Credentials come from .env (see .env.example);
# required variables fail fast with a clear message when .env is missing.
# The Caddy service is gated behind the "proxy" profile: it routes to app
# services that do not exist until the application phase, so it is not part
# of the default `docker compose up`.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-raguard}
    ports:
      # Host bind is env-shifted (POSTGRES_PORT) so a busy host 5432 can be
      # avoided locally; the worker reaches postgres via the service network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Shared memory needed for pgvector HNSW index builds (upstream guidance)
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [raguard]

  redis:
    image: redis:8.10.0-alpine
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # No published ports: reachable only on the compose network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [raguard]

  # Local-only object storage. NOTE: the upstream MinIO project is no longer
  # maintained and points to AIStor; this image is pinned for local development
  # only. Revalidate before any production use; S3/R2 are the production targets.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-raguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [raguard]

  caddy:
    image: caddy:2.11.4-alpine
    # Gated behind `proxy` (standalone proxy, as before) and `app` (full
    # application stack: `docker compose --profile app up` brings Caddy up
    # alongside the profile-gated `api`/`web` backends). Still excluded from
    # the default (profile-less) stack. No depends_on: with `proxy` alone the
    # backends do not exist, and Caddy retries upstreams on its own.
    profiles: ["proxy", "app"]
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [raguard]

  # One-shot bucket provisioning for the worker/API object store (the boto3
  # put path fails without an existing bucket). Runs once before the worker
  # starts and exits; image pinned to the minio release era.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-raguard}
        ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required} &&
        mc mb --ignore-existing local/${OBJECT_STORE_BUCKET:-raguard-documents}
    networks: [raguard]

  # Opt-in local model runtime (profile `local-ai`). Official Ollama image pinned
  # to a stable tag — never `latest`. Models persist in the `ollama` named
  # volume; the API port is loopback-only. No GPU/devices/privileged: CPU
  # inference works out of the box. Start explicitly, then pull models once
  # (see README "Local AI (Ollama)"):
  #   docker compose -f infra/compose.yaml --profile local-ai up -d ollama
  #   docker compose -f infra/compose.yaml exec ollama ollama pull qwen3-embedding:0.6b
  #   docker compose -f infra/compose.yaml exec ollama ollama pull qwen3:1.7b
  ollama:
    image: ollama/ollama:0.34.1
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # `ollama list` talks to the loopback daemon, so a zero exit means the
    # server is up; the image carries no curl/wget to probe with instead.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [raguard]

  # Ingestion worker (apps/worker/Dockerfile). Runs the declared runtime
  # command `uv run arq raguard_worker.settings.WorkerSettings`; all settings
  # arrive as environment (credentials from .env via interpolation, never
  # baked into the image). Starts only after Postgres/Redis/MinIO are healthy
  # and the bucket exists; the sweep cron also drives the PR5 age alerts.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      # Default uses the owner role (RLS bypassed: non-FORCE policies from
      # migration 0006 keep today's behavior). Opt-in hardening: set a password
      # for the `raguard_app` role (ALTER ROLE raguard_app WITH LOGIN PASSWORD
      # '...') and point DATABASE_URL at it, e.g.
      # DATABASE_URL: postgresql+psycopg://raguard_app:${RAGUARD_APP_PASSWORD:?RAGUARD_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-raguard}
      # then scope sessions via tenant_scoped_session (SET LOCAL app.tenant_id).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raguard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-raguard}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-raguard-documents}
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-raguard}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORE_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Embedding provider selection (WorkerSettings: EMBEDDING_PROVIDER,
      # EMBEDDING_MODEL, OLLAMA_*). Defaults keep the OpenAI path, so the
      # default stack never depends on the profile-gated `ollama` service.
      # OLLAMA_BASE_URL is the in-network service URL; host-side runs use the
      # code default http://127.0.0.1:11434 (see README "Local AI (Ollama)").
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      SWEEP_AGE_SECONDS: ${SWEEP_AGE_SECONDS:-300}
      PENDING_AGE_SECONDS: ${PENDING_AGE_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [raguard]

  # FastAPI service (apps/api/Dockerfile, F6). Profile-gated (`app`), so the
  # default stack is unchanged: plain `up` still starts only
  # postgres/redis/minio/minio-init/worker. Uvicorn serves the
  # `create_default_app` factory on the internal network; Caddy is the sole
  # ingress (`/api/*` -> api:8000), so no port is published to the host.
  # Environment mirrors the worker (service-network hostnames for
  # postgres/redis/minio) plus the API-only settings: JWT_*, session cookie
  # (SECURE defaults false: local Caddy is plain http), provider/chat
  # selectors, and the F4 rate-limit bounds. TRUST_PROXY_HEADERS defaults to
  # true here because the only ingress is the compose Caddy (which sets
  # X-Forwarded-For itself); host-side runs keep the code default false.
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raguard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-raguard}
      JOB_QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-}
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-raguard-documents}
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-raguard}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORE_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-500}
      CHAT_RETRIES: ${CHAT_RETRIES:-2}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      RETRIEVAL_SEMANTIC_MAX_DISTANCE: ${RETRIEVAL_SEMANTIC_MAX_DISTANCE:-0.5}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-raguard}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-raguard-api}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-raguard_session}
      SESSION_COOKIE_PATH: ${SESSION_COOKIE_PATH:-/api}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:5173", "http://localhost"]}'
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [raguard]

  # Web frontend (apps/web/Dockerfile, F6): Vite dev server on :5173 behind
  # Caddy (same-origin `/api/*` keeps session cookies first-party). Profile-
  # gated (`app`); ordered after `api` for startup only (no health gate: the
  # dev server needs nothing from the API at boot). No published port: Caddy
  # is the sole ingress. Source is baked into the image; refresh with
  # `docker compose --profile app build web`.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    profiles: ["app"]
    depends_on:
      api:
        condition: service_started
    networks: [raguard]

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollama:
  caddydata:
  caddyconfig:

networks:
  raguard:
    driver: bridge
