[project]
name = "raguard-worker"
version = "0.1.0"
description = "raguard async worker: ingestion pipeline over Redis + Arq"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arq>=0.26,<0.29",
    "boto3>=1.34,<2",
    "openai>=1.40,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "pypdf>=6.15.0,<7",
    "raguard-api",
    "redis[hiredis]>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
raguard-api = { workspace = true }

[tool.uv]
package = true
