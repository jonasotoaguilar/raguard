[project]
name = "raguard-eval"
version = "0.1.0"
description = "raguard offline evaluation harness — dataset validation and deterministic hash"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "raguard-api",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
raguard-api = { workspace = true }
