# Alembic configuration for the raguard API (apps/api).
# script_location and prepend_sys_path are anchored to this file's directory.
# sqlalchemy.url is intentionally NOT set here: env.py resolves it from the
# DATABASE_URL environment variable (CLI) or from the URL injected by tests.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
