[project]
name = "raguard-api"
version = "0.1.0"
description = "raguard API service: JWT auth, org-scoped RBAC, documents, retrieval, chat"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "arq>=0.26,<0.29",
    "boto3>=1.34,<2",
    "fastapi>=0.119,<0.142",
    "openai>=1.40,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "redis[hiredis]>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<0.53",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true
