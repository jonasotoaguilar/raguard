min_version: 2.1.10

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: ruff
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format {staged_files}

pre-push:
  jobs:
    - name: pytest
      if: "find apps -name 'test_*.py' -o -name '*_test.py' | grep -q ."
      run: uv run pytest -m "not e2e"

    - name: web-vitest
      run: pnpm --filter @raguard/web test
